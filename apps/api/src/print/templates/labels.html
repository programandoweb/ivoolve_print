<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Etiquetas</title>

  <style>
    @page {
      size: 150mm auto;
      margin: 0;
    }

    body {
      margin: 0;
      padding: 4mm;
      font-family: Arial, sans-serif;
    }

    .sheet {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2mm;
    }

    .label {
      border: 1px solid #000;
      width: 48mm;
      height: 30mm;
      padding: 2mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      page-break-inside: avoid;
    }

    .title {
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }

    .code {
      font-size: 10px;
    }

    .variant {
      font-size: 11px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="sheet">
    {{LABELS}}
  </div>
</body>
</html>
